[versions]
# The plugin is built for exactly this OpenSearch release; the test image uses the same version.
opensearch-server = "3.10.0"
opensearch-testcontainers = "4.1.1"
testcontainers = "2.0.5"
junit = "6.1.3"
assertj = "3.27.7"
jackson = "2.23.0"
slf4j = "2.0.17"
# Login provider image used by the Keycloak container test.
keycloak-image = "26.8.2"

[libraries]
opensearch-server = { module = "org.opensearch:opensearch", version.ref = "opensearch-server" }
opensearch-testcontainers = { module = "org.opensearch:opensearch-testcontainers", version.ref = "opensearch-testcontainers" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
